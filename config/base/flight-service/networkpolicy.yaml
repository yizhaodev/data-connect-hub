apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flight-service
  labels:
    app.kubernetes.io/name: flight-service
    app.kubernetes.io/part-of: data-connect-hub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flight-service
  policyTypes:
    - Ingress
  ingress:
    # REST service → Flight (same namespace)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rest-service
      ports:
        - protocol: TCP
          port: 8443
    # Gateway proxy → Flight (gRPC, port 8443).
    # The namespace value is a placeholder; the controller patches it to the
    # resolved gateway namespace at render time.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opendatahub
      ports:
        - protocol: TCP
          port: 8443
    # Metrics scraping.
    # TODO: restrict source to the monitoring namespace once the set of
    # Prometheus deployment topologies (OpenShift, standalone, ODH) is
    # settled.
    - ports:
        - protocol: TCP
          port: 9090
