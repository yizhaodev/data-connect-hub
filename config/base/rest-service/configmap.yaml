apiVersion: v1
kind: ConfigMap
metadata:
  name: rest-service-config
  labels:
    app.kubernetes.io/name: rest-service
    app.kubernetes.io/part-of: data-connect-hub
data:
  config.toml: |
    [server]
    address = "0.0.0.0"
    port = 8080

    [global-connection-types]
    tenant-id = "opendatahub"

    [flight-service]
    address = "flight-service"
    port = 50051

    [otel]
    enabled = false
    service_name = "dch-rest-service"
    # protocol = "grpc"  # or "http"
    # endpoint = "http://otel-collector.observability.svc:4317"
    # Headers can also be set via the OTEL_EXPORTER_OTLP_HEADERS env var
    # (format: "k1=v1,k2=v2"), and the endpoint via
    # OTEL_EXPORTER_OTLP_ENDPOINT / OTEL_SERVICE_NAME.
